name: Build Fokus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          xcodebuild -project Fokus.xcodeproj \
            -target Fokus \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer Fokus.ipa
        run: |
          APP_PATH=$(find build -type d -name "Fokus.app" | head -n 1)
          echo "App trouvée : $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Fokus.ipa Payload

      - name: Garder le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fokus-ipa
          path: Fokus.ipa

      - name: Publier une release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fokus (build ${{ github.run_number }})
          files: Fokus.ipa
          make_latest: true
